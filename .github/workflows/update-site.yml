name: Update site

# Rebuild the GitHub Pages site (docs/) with fresh 17Lands data every day,
# and commit it only if something changed.
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      sets:
        description: "Set codes to build, space-separated"
        default: "TRK"
      period:
        description: "17Lands time window"
        default: "LAST_WEEK"

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

env:
  # Change these to build other sets / another time window on the daily run.
  SETS: ${{ github.event.inputs.sets || 'TRK' }}
  PERIOD: ${{ github.event.inputs.period || 'LAST_WEEK' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Scryfall image links never change, so keep them between runs.
      - uses: actions/cache@v4
        with:
          path: cache/scryfall
          key: scryfall-${{ github.run_id }}
          restore-keys: scryfall-

      - name: Build site
        run: |
          for s in $SETS; do
            python synergy_map.py "$s" --period "$PERIOD" --no-png --out-dir docs --fresh
          done

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Refresh 17Lands data ($(date -u +%F))"
          git push
